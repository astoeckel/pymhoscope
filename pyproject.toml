[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pymhoscope"
version = "0.1.0"
description = "Capture analogue and logic analyser data from Rigol MHO900 series oscilloscopes"
readme = "README.md"
authors = [
    { name = "Andreas Stöckel" }
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["oscilloscope", "rigol", "mho900", "scpi", "logic analyser", "lxi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "zeroconf>=0.100",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["pymhoscope"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]

# Scripts declare their own dependencies (PEP 723) that are not installed in
# the project environment.
[[tool.ty.overrides]]
include = ["scripts/**"]
rules = { import-not-found = "ignore" }
